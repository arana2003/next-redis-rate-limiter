name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Gateway (tests and build)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/app_db
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  analytics:
    name: Analytics (dbt)
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core>=1.8,<2" "dbt-duckdb>=1.8,<2"
      - name: Build and test the dbt project
        working-directory: analytics
        run: |
          dbt seed --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .
